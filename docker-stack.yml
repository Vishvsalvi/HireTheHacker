services:
  postgres_db:
    image: postgres:17-alpine
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.2"
          memory: "256M"
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 60s
    secrets:
      - RESUME_AI_POSTGRES_USER
      - RESUME_AI_POSTGRES_PASS
      - RESUME_AI_POSTGRES_DB
    environment:
      POSTGRES_USER_FILE: /run/secrets/RESUME_AI_POSTGRES_USER
      POSTGRES_PASSWORD_FILE: /run/secrets/RESUME_AI_POSTGRES_PASS
      POSTGRES_DB_FILE: /run/secrets/RESUME_AI_POSTGRES_DB
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudmesh"]
      interval: 1m
      timeout: 30s
      retries: 5
      start_period: 30s
    volumes:
      - resumeai_postgres_db:/var/lib/postgresql/data
    networks:
      - resumeai

  redis_db:
    image: redis:7.4.2-alpine
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"
        reservations:
          cpus: "0.2"
          memory: "256M"
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 60s
    secrets:
      - RESUME_AI_REDIS_PASS
    command: ["/bin/sh", "-c", "redis-server --requirepass $$(cat /run/secrets/RESUME_AI_REDIS_PASS)"]
    ports:
      - 6379:6379
    volumes:
      - resumeai_redis_db:/data
    networks:
      - resumeai

networks:
  resumeai:

volumes:
  resumeai_postgres_db:
  resumeai_redis_db:

secrets:
  RESUME_AI_POSTGRES_USER:
    external: true
  RESUME_AI_POSTGRES_PASS:
    external: true
  RESUME_AI_POSTGRES_DB:
    external: true
  RESUME_AI_REDIS_PASS:
    external: true
